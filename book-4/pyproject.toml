[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "iceberg-bookshop-migration"
version = "0.1.0"
description = "Authored, unrun migration exercises for the Iceberg Migration Playbook"
requires-python = ">=3.13"
dependencies = ["pyiceberg[sql-sqlite,pyarrow]==0.11.1", "pyarrow==25.0.1", "duckdb==1.5.5"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
spark = ["pyspark==4.1.3"]
postgres = ["psycopg[binary]==3.2.10"]

[project.scripts]
book4 = "iceberg_migration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
