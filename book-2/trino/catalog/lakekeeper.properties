# Lakekeeper 'wild': vended credentials, no static S3 credentials.
#
# Trino takes the vended CREDENTIALS but not the vended ENDPOINT: without an
# explicit s3.endpoint every metadata HEAD failed ("Failed to get status for
# file: s3://warehouse/lakekeeper/.../00001-...gz.metadata.json"). The
# warehouse's endpoint is host.docker.internal:8333, which a container CAN
# resolve, so the same address works here.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=wild
iceberg.rest-catalog.vended-credentials-enabled=true
fs.native-s3.enabled=true
s3.endpoint=http://host.docker.internal:8333
s3.path-style-access=true
s3.region=us-east-1
