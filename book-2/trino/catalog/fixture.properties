# The reference REST catalog (stage 1). No auth; static S3 credentials; the
# store is reached by its in-network name because Trino is a container.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://catalog:8181
iceberg.rest-catalog.warehouse=s3://warehouse/
fs.native-s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.path-style-access=true
s3.region=us-east-1
s3.aws-access-key=lab-access-key
s3.aws-secret-key=lab-secret-key
