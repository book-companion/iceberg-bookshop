# Polaris 'wild_sts': OAuth2 + vended credentials through SeaweedFS STS.
# No static S3 credentials here on purpose.
#
# Polaris vends its CLIENT-FACING `endpoint` (http://localhost:8333, right for
# the host, wrong for a container) — so Trino, a container, must state the
# in-network address itself. Whether an explicit s3.endpoint here beats the
# vended one is exactly what this file tests.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
iceberg.rest-catalog.warehouse=wild_sts
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=root:s3cr3t
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
iceberg.rest-catalog.vended-credentials-enabled=true
fs.native-s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.path-style-access=true
s3.region=us-east-1
