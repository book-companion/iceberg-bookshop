# A counting reverse proxy in front of the object store (Book 2 ch2): every
# S3 request a client makes passes through here and is logged as
# METHOD PATH?QUERY, so a probe can attribute request counts to an Iceberg
# operation. The store itself keeps no such log in mini mode.
log_format s3 '$request_method $request_uri $status $body_bytes_sent inm=$http_if_none_match im=$http_if_match';
access_log /var/log/nginx/s3.log s3;
server {
  listen 8334;
  client_max_body_size 0;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_http_version 1.1;
  location / {
    proxy_pass http://seaweedfs:8333;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
  }
}
