[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iceberg-bookshop-agents"
version = "0.1.0"
description = "Companion draft for Data Agents on Apache Iceberg"
requires-python = ">=3.13"
dependencies = ["duckdb==1.5.5", "pyarrow==25.0.1", "pyiceberg[sql-sqlite,pyarrow]==0.11.1", "sqlglot==27.29.0"]

[project.optional-dependencies]
agent = ["mcp==1.30.0", "claude-agent-sdk==0.2.152"]
spark = ["pyspark==4.1.3"]
test = ["pytest==8.4.2"]

[project.scripts]
book3 = "iceberg_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["stack: requires the isolated Iceberg platform", "model: consumes model calls"]
