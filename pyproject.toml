[project]
name = "iceberg-bookshop"
version = "1.0.0"
description = "Clone-and-run companion for 'Apache Iceberg from the Ground Up' by Simon Sarkar"
requires-python = ">=3.12"
dependencies = [
    # Pinned to exactly what the book was written and run against.
    "pyiceberg[sql-sqlite,pyarrow,duckdb]==0.11.1",
    "pyspark==4.1.3",          # NOT 4.2 — no Iceberg runtime exists for Spark 4.2
    "duckdb==1.5.5",
    "polars==1.44.1",
    "pandas>=2.2",
    "pyarrow>=17",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bookshop"]
